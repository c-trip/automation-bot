name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Só precisa ser uma URL válida — o `prisma generate` (rodado no postinstall)
      # lê essa variável mas não chega a abrir conexão com o banco.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/joyce_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Build
        run: pnpm build
